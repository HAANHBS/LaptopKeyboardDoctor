name: Publish Windows release

on:
  push:
    branches: [main]
    paths:
      - .release/version
      - .github/workflows/release-windows.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify source package
        run: python tests\verify_package.py

      - name: Build and run detector self-tests
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File Build.ps1

      - name: Validate release version and one-file package
        shell: powershell
        run: |
          $tag = (Get-Content -LiteralPath .release/version -Raw).Trim()
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid release tag: $tag"
          }
          $files = @(Get-ChildItem -LiteralPath dist -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'LaptopKeyboardDoctor.exe') {
            throw 'Release must contain exactly one LaptopKeyboardDoctor.exe'
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $hash = (Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "RELEASE EXE SHA256: $hash"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'dist/LaptopKeyboardDoctor.exe'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $payload = @{
            tag_name = $env:RELEASE_TAG
            target_commitish = $env:GITHUB_SHA
            name = "Laptop Keyboard Doctor $env:RELEASE_TAG"
            body = 'Bản portable Windows: một file EXE duy nhất để chép USB. Nguồn mở MIT — MÁY TÍNH HÀ ANH, xã Như Thanh, tỉnh Thanh Hoá.'
            draft = $false
            prerelease = $false
          } | ConvertTo-Json
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" `
            -Method Post -Headers $headers -ContentType 'application/json' -Body $payload
          $uploadUrl = $release.upload_url -replace '\{\?name,label\}$', ''
          $assetName = [Uri]::EscapeDataString([IO.Path]::GetFileName($asset))
          $uploaded = Invoke-RestMethod `
            -Uri ($uploadUrl + '?name=' + $assetName) `
            -Method Post -Headers $headers -ContentType 'application/octet-stream' -InFile $asset
          if ($uploaded.name -ne 'LaptopKeyboardDoctor.exe') {
            throw 'GitHub Release asset verification failed.'
          }
          Write-Host "RELEASE: PASS - $($release.html_url)"
